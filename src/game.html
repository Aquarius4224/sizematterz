<title>貪食屌</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
/* Layout: full-screen WebGL canvas, HUD floats at the corners, overlays centered. One committed look (soft lagoon arena), not theme-switched. */
:root {
  --ink: #12343a;
  --ink-soft: #3d6168;
  --paper: #f3fbf9;
  --lagoon: #bfe3dd;
  --deep: #1d4a52;
  --pop: #ff5a7a;
  --sun: #ffd166;
  --glass: rgba(243, 251, 249, 0.82);
  --font-display: "Fredoka", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-body: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--deep); color: var(--ink);
  font-family: var(--font-body); touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
.hud { position: fixed; z-index: 5; pointer-events: none; font-family: var(--font-display); }
#stats {
  top: calc(10px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
  background: var(--glass); border-radius: 14px; padding: 8px 12px; display: grid; gap: 2px;
  font-variant-numeric: tabular-nums; box-shadow: 0 2px 10px rgba(0,0,0,.12);
}
#stats .big { font-size: 22px; font-weight: 700; line-height: 1.1; }
#stats .small { font-size: 12px; color: var(--ink-soft); letter-spacing: .04em; }
#board {
  top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--glass); border-radius: 14px; padding: 8px 10px; min-width: 120px;
  font-size: 13px; font-variant-numeric: tabular-nums; box-shadow: 0 2px 10px rgba(0,0,0,.12);
}
#board .title { font-size: 11px; letter-spacing: .08em; color: var(--ink-soft); margin-bottom: 4px; }
#board .row { display: grid; grid-template-columns: 12px 1fr auto; gap: 6px; align-items: center; padding: 1px 0; }
#board .row.me { font-weight: 700; }
#board .dot { width: 10px; height: 10px; border-radius: 50%; }
.btn {
  position: fixed; z-index: 6; border: 0; font-family: var(--font-display); font-weight: 700;
  color: var(--ink); background: var(--glass); box-shadow: 0 3px 12px rgba(0,0,0,.18); cursor: pointer;
}
.btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
#boost {
  right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  width: 84px; height: 84px; border-radius: 50%; font-size: 17px;
}
#boost.on { background: var(--sun); transform: scale(.94); }
#boost { overflow: hidden; }
#boost .cd { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; display: grid; place-items: center;
  background: conic-gradient(rgba(18,52,58,.6) var(--p, 0%), transparent 0); color: #fff; font-size: 22px; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
#boost .cd:empty { background: none; }
#boost.gauge .cd:empty { background: conic-gradient(rgba(18,52,58,.45) var(--p, 0%), transparent 0); } /* 噴射: used part of the tank */
#boost .lbl { position: relative; font-size: 15px; line-height: 1.15; padding: 0 8px; }
#boost.cooling .lbl { opacity: 0; }
#boost.ready { box-shadow: 0 0 0 3px var(--sun), 0 3px 12px rgba(0,0,0,.18); }
#coneBtn {
  right: calc(112px + env(safe-area-inset-right, 0px)); bottom: calc(30px + env(safe-area-inset-bottom, 0px));
  height: 40px; padding: 0 14px; border-radius: 20px; font-size: 13px;
}
#coneBtn[aria-pressed="false"] { opacity: .6; }
#joy {
  position: fixed; z-index: 4; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
  background: rgba(18,52,58,.12); border: 2px solid rgba(18,52,58,.35); pointer-events: none;
}
#joy .knob {
  position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%;
  background: rgba(255,255,255,.85); box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
#toast {
  top: 26%; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: 700; color: var(--paper);
  text-shadow: 0 3px 0 var(--deep), 0 0 18px rgba(0,0,0,.35); opacity: 0; transition: opacity .25s, transform .25s;
}
#toast.show { opacity: 1; transform: translateY(-6px); }
/* tutorial */
#tutBox {
  position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); top: calc(84px + env(safe-area-inset-top, 0px));
  width: min(360px, calc(100% - 32px)); background: var(--paper); border-radius: 18px; padding: 12px 16px 12px;
  box-shadow: 0 6px 24px rgba(0,0,0,.22); display: grid; gap: 6px; font-size: 14px; line-height: 1.55; color: var(--ink);
}
#tutBox[hidden] { display: none; }
#tutBox .tstep { font-size: 11px; letter-spacing: .08em; color: var(--ink-soft); display: flex; justify-content: space-between; align-items: center; }
#tutBox h3 { margin: 0; font-family: var(--font-display); font-size: 19px; }
#tutBox p { margin: 0; text-wrap: pretty; }
#tutBox .chips { display: flex; gap: 6px; }
#tutBox .chips span { width: 34px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: #e6ece9; font-weight: 700; transition: background .2s; }
#tutBox .chips span.ok { background: var(--sun); }
#tutBox .bar { height: 8px; border-radius: 4px; background: #e6ece9; overflow: hidden; }
#tutBox .bar i { display: block; height: 100%; width: 0; background: var(--sun); transition: width .1s; }
#tutBox .skip { background: none; border: 0; padding: 4px 2px; font: inherit; font-size: 12px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; }
#tutBox .go { justify-self: center; }
body.tut #board { display: none; }
body.tut-noskill #boost { display: none; }
body.tut #boost { animation: none; }
body.tut-pulse #boost { animation: tutPulse 1.1s ease-in-out infinite; }
@keyframes tutPulse { 50% { box-shadow: 0 0 0 8px rgba(255,209,102,.55), 0 3px 12px rgba(0,0,0,.18); } }
@media (prefers-reduced-motion: reduce) { body.tut-pulse #boost { animation: none; box-shadow: 0 0 0 4px var(--sun); } }
.overlay {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(18, 52, 58, .55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
.card {
  background: var(--paper); border-radius: 24px; padding: 24px 22px; max-width: 360px; width: 100%;
  box-shadow: 0 10px 40px rgba(0,0,0,.3); display: grid; gap: 14px; text-align: center;
}
.card h1 { margin: 0; font-family: var(--font-display); font-size: 40px; line-height: 1; color: var(--pop); letter-spacing: .02em; }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 24px; text-wrap: balance; }
.card p { margin: 0; line-height: 1.6; font-size: 15px; color: var(--ink-soft); text-wrap: pretty; }
.card ul { margin: 0; padding: 0; list-style: none; text-align: left; display: grid; gap: 8px; font-size: 14px; line-height: 1.5; }
.card li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
.card li b { font-family: var(--font-display); background: var(--lagoon); border-radius: 8px; text-align: center; font-size: 13px; line-height: 22px; }
.card svg { width: 100%; max-width: 260px; justify-self: center; }
.play {
  border: 0; border-radius: 16px; padding: 14px; font-family: var(--font-display); font-size: 20px; font-weight: 700;
  background: var(--pop); color: #fff; cursor: pointer; box-shadow: 0 4px 0 #c43858;
}
.play:active { transform: translateY(2px); box-shadow: 0 2px 0 #c43858; }
.play:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.menu { gap: 12px; }
.menu h1 { font-size: 46px; margin-bottom: 6px; }
.play.big { font-size: 34px; padding: 22px 14px; border-radius: 22px; letter-spacing: .06em; box-shadow: 0 6px 0 #c43858; }
.sub {
  border: 0; border-radius: 16px; padding: 12px 16px; font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: .05em;
  background: var(--lagoon); color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  box-shadow: 0 4px 0 #8fc2ba;
}
.sub:active { transform: translateY(2px); box-shadow: 0 2px 0 #8fc2ba; }
.sub:focus-visible, .opt:focus-visible, .sw:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.sub small { font-size: 14px; font-weight: 500; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; letter-spacing: 0; }
.sub .dot { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0,0,0,.12); }
.hint { font-size: 13px !important; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 10px; }
.sw { aspect-ratio: 1; border-radius: 50%; border: 0; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(0,0,0,.1); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--ink); }
.opts { display: grid; gap: 10px; }
.card.scroll { max-height: calc(100dvh - 32px); overflow-y: auto; overscroll-behavior: contain; }
.card h3 { margin: 6px 0 0; font-family: var(--font-display); font-size: 17px; text-align: left; }
.skinPrev { justify-self: center; width: 78%; height: 34px; border-radius: 17px; background-size: 68px 68px; box-shadow: inset 0 -6px 10px rgba(0,0,0,.18), inset 0 4px 8px rgba(255,255,255,.35); }
.pats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pat { border: 2px solid transparent; border-radius: 16px; padding: 6px 6px 10px; background: #fff; cursor: pointer; text-align: left; display: grid; gap: 4px;
  font-family: var(--font-body); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.pat .th { aspect-ratio: 1.4; border-radius: 11px; background-size: 72px 72px; box-shadow: inset 0 -8px 14px rgba(0,0,0,.15); }
.pat b { font-family: var(--font-display); font-size: 15px; padding: 0 4px; }
.pat span { font-size: 12px; color: var(--ink-soft); line-height: 1.35; padding: 0 4px; }
.pat[aria-pressed="true"] { border-color: var(--pop); background: #fff5f7; }
.pat:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.opt {
  border: 2px solid transparent; border-radius: 16px; padding: 12px 14px; background: #fff; cursor: pointer; text-align: left;
  font-family: var(--font-body); color: var(--ink); display: grid; gap: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
}
.opt b { font-family: var(--font-display); font-size: 18px; display: flex; justify-content: space-between; align-items: baseline; }
.opt b span { font-size: 12px; font-weight: 500; color: var(--ink-soft); }
.opt p { font-size: 13px !important; line-height: 1.5 !important; }
.opt[aria-pressed="true"] { border-color: var(--pop); background: #fff5f7; }
.back { border: 0; background: none; font-family: var(--font-display); font-size: 16px; color: var(--ink-soft); cursor: pointer; padding: 6px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.statline { font-family: var(--font-display); font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
#titleOv { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; cursor: pointer;
  background: radial-gradient(ellipse at 50% 45%, rgba(40, 20, 70, .55), rgba(10, 6, 24, .82)); transition: opacity .5s ease; }
#titleOv.out { opacity: 0; pointer-events: none; }
#titleOv .tbox { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(96vw, 860px); aspect-ratio: 1536 / 768;
  transition: top .75s cubic-bezier(.3,1.25,.4,1), width .75s cubic-bezier(.3,1.25,.4,1), transform .75s cubic-bezier(.3,1.25,.4,1); }
/* after the intro the logo docks at the top of the start menu, which sits lower to make room */
:root { --logoW: min(84vw, 520px, 60vh); }
#titleOv.docked { background: transparent; pointer-events: none; transition: background .6s ease, opacity .3s ease; }
#titleOv.docked .tbox { top: calc(env(safe-area-inset-top, 0px) + 4px); transform: translate(-50%, 0); width: var(--logoW); }
#titleOv.docked .skip { opacity: 0; }
body:not(:has(#startOv:not([hidden]))) #titleOv.docked { opacity: 0; }
#startOv { align-items: start; overflow-y: auto; padding-top: calc(env(safe-area-inset-top, 0px) + var(--logoW) * .47 + 8px); padding-bottom: 16px; }
#startOv .card.menu h1 { font-size: 30px; margin-bottom: 0; }
#titleOv .tl { position: absolute; will-change: transform, opacity; }
#titleOv .tl img { display: block; width: 100%; height: 100%; pointer-events: none; user-select: none; -webkit-user-drag: none; }
#titleOv .lid { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, transparent var(--r), var(--c) calc(var(--r) + 14%)); }
#titleOv .skip { transition: opacity .3s; position: absolute; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center;
  font-family: var(--font-display); font-size: 14px; color: rgba(255,255,255,.55); letter-spacing: .1em; }
</style>

<canvas id="game"></canvas>

<div class="hud" id="stats">
  <div class="small">長度</div><div class="big" id="sLen">8.0</div>
  <div class="small" id="sMore">粗細 0.60 · 同化 0</div>
</div>
<div class="hud" id="board"><div class="title">排行</div><div id="boardRows"></div></div>
<div class="hud" id="toast"></div>
<div id="joy" hidden><div class="knob" id="knob"></div></div>
<button class="btn" id="coneBtn" aria-pressed="true">判定範圍</button>
<button class="btn" id="boost"><span class="lbl" id="skillLbl">加速</span><span class="cd" id="skillCd"></span></button>

<div id="tutBox" hidden>
  <div class="tstep"><span id="tutStep"></span><button class="skip" id="tutSkip">跳過教學</button></div>
  <h3 id="tutTitle"></h3>
  <p id="tutText"></p>
  <div id="tutExtra"></div>
</div>

<div class="overlay" id="startOv">
  <div class="card menu">
    <h1>貪食屌</h1>
    <button class="play big" id="startBtn">START</button>
    <button class="sub" id="skinBtn">SKIN <small>造型 <span class="dot" id="skinDot"></span></small></button>
    <button class="sub" id="skillBtn">SKILL <small id="skillName">技能</small></button>
    <button class="sub" id="mapBtn">MAP <small id="mapName">地圖</small></button>
    <button class="back" id="tutBtn">再看一次教學</button>
    <p class="hint">拖動螢幕控制方向。從別人尾巴後方 ±45° 撞進去，就能把整條蛇同化。</p>
  </div>
</div>

<div class="overlay" id="skinOv" hidden>
  <div class="card scroll">
    <h2>選擇造型</h2>
    <div class="skinPrev" id="skinPrev" aria-hidden="true"></div>
    <h3>基本顏色</h3>
    <div class="swatches" id="swatches"></div>
    <h3>花紋</h3>
    <div class="pats" id="pats"></div>
    <button class="back" data-back>‹ 返回</button>
  </div>
</div>

<div class="overlay" id="skillOv" hidden>
  <div class="card scroll">
    <h2>選擇技能</h2>
    <p>選一個帶進遊戲，用右下角的技能鍵發動。</p>
    <div class="opts" id="skillOpts"></div>
    <button class="back" data-back>‹ 返回</button>
  </div>
</div>

<div class="overlay" id="mapOv" hidden>
  <div class="card scroll">
    <h2>選擇地圖</h2>
    <div class="opts" id="mapOpts"></div>
    <button class="back" data-back>‹ 返回</button>
  </div>
</div>

<div class="overlay" id="overOv" hidden>
  <div class="card">
    <h2 id="overTitle">你被同化了</h2>
    <p class="statline" id="overStats"></p>
    <div class="row2"><button class="sub" id="menuBtn" style="justify-content:center">主選單</button><button class="play" id="againBtn">再來一局</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

/* =====================================================================
   SIM — pure game state, no rendering. Written so it can later move to an
   authoritative Node.js WebSocket server unchanged: step(dt, inputs).
   ===================================================================== */
const CFG = {
  S: 0.5,             // trail sample spacing
  START_LEN: 8, START_R: 0.6,
  MAX_LEN: 200, MAX_R: 3.2,
  FOOD: 170, AI: 7,
  CONE: Math.PI / 4,  // absorb cone half-angle behind the tail
  SPEED: 7.5, BOOST: 13, TURN: 4.2,
  BOOST_LEN: 3.2, BOOST_THIN: 0.024, // per second of boosting: length lost, radius lost
  SKILL_CD: 30, GUARD_T: 3, SWAP_T: 0.6,
  OURO_CD: 15, OURO_T: 5, OURO_IN: 0.3,
  SPRAY_EMPTY: 5, SPRAY_FILL: 30, SPRAY_DT: 0.07, PUDDLE_T: 5, PUDDLE_SLOW: 0.7, SPRAY_REACH: 2, SHOWER_FAST: 1.3,
  TISSUE_T: 6, TISSUE_SLOW: 0.65, TISSUE_RESPAWN: [15, 30],
  BUBBLE_T: 5, CONDOM_WAIT: [5, 60], CONDOM_FLY: 1.1,
};
// skills a player can bring into a game (AI snakes always use boost)
const SKILLS = {
  boost: { name: '加速', cd: 0,  desc: '按住加速。尾巴的洞會一直流水，身體慢慢變短變細（扣分）。' },
  swap:  { name: '頭尾交換', cd: 30, desc: '頭往內縮變成新的尾巴，原本的尾巴冒出頭來，往反方向走。' },
  guard: { name: '縮緊', cd: 30, desc: '尾巴洞口縮起來，3 秒內不會被同化。' },
  spray: { name: '噴射', cd: 0, gauge: true, desc: '按住從嘴巴噴出跟身體同色的液體，地上留下水灘 5 秒，別的蛇踩到會減速 30%。滿槽可噴 5 秒，放開後約 30 秒補滿。' },
  ouro:  { name: '銜尾蛇', cd: 15, passive: true, desc: '不用按鍵：把頭繞進自己的尾巴，就會咬住自己 5 秒，這段時間尾巴不會被同化。' },
};
const COS_CONE = Math.cos(CFG.CONE);
// ---- MAP: the bathroom from Chiu's floor plan (1 unit ≈ 10.8 px of the 1448×1086 image) ----
// Floor is a W×H rectangle centred on the origin; +x = right, +z = towards the door (bottom of the plan).
// Fixtures are solid boxes nobody can pass through. Pushed against a wall where they touch one, so no thin traps.
const MAPS = {
  bathroom: {
    name: '浴室', desc: '淋浴區的濕地可以加速，噴射的水灘在那裡沒有效果。',
    W: 120, H: 86, door: [-12, 8],
    obstacles: [
      { name: 'vanity', x0: -19, x1: 23, z0: -43, z1: -6.5 },   // sink cabinet on the top wall
      { name: 'tub',    x0: 27,  x1: 60, z0: -43, z1: 31 },     // bathtub platform on the right wall
      { name: 'toilet', x0: -60, x1: -29, z0: 17.5, z1: 34 },   // toilet on the left wall
    ],
    mat: { x0: -14, x1: 17, z0: 1.8, z1: 22.8, h: 0.25 },        // raised bath mat
    // shower corner (open floor): water falls around the drain and leaves clear wet patches.
    // Standing in a wet patch makes you faster; spray puddles don't work (or stay) in here.
    shower: { x0: -60, x1: -25, z0: -43, z1: 7, cx: -42, cz: -24, rain: 9 },
    wet: [ // ellipses: centre x, z, radii rx, rz
      [-42, -24, 7, 6], [-50.5, -14, 5, 4], [-34, -33, 5.5, 4], [-52, -32.5, 4.5, 5], [-32.5, -15, 4, 5],
      [-44, -5, 5, 3.5], [-55.5, -22, 3.5, 4.5], [-35.5, -24, 3, 3], [-46, -38.5, 4, 3],
    ],
  },
  // bedroom from Chiu's top-down picture (1 unit ≈ 10.9 px, room centre at px 725, 535)
  bedroom: {
    name: '臥室', desc: '床、書桌、書櫃和地毯，中間空地大，四周角落多。',
    W: 120, H: 86, door: [13.3, 29.4],
    obstacles: [
      { name: 'bed',      x0: -60,  x1: 4.6,  z0: -43,   z1: -5 },
      { name: 'stand',    x0: -60,  x1: -42.2, z0: -5,   z1: 11 },
      { name: 'desk',     x0: 28.4, x1: 60,   z0: -43,   z1: 21.6 },
      { name: 'chair',    x0: 19.5, x1: 28.4, z0: -13,   z1: 6.5 },
      { name: 'shelf',    x0: -60,  x1: 6.5,  z0: 35,    z1: 43 },
      { name: 'backpack', x0: 8.7,  x1: 19.3, z0: -34.4, z1: -22.5 },
      { name: 'door1',    x0: 18.2, x1: 24.2, z0: 30,    z1: 37.2 },
      { name: 'door2',    x0: 23,   x1: 29.4, z0: 36.2,  z1: 43 },

function buildMap(id) {

    track: m => { if (grp) grp.meshes.push(m); return m; },

  k.add = (geo, mat, x, y, z, shadow = true) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; mapRoot.add(m); return k.track(m); };

  k.group(null);
  mapShower = MAP.shower ? makeShower(mapRoot) : null;

  scene.updateMatrixWorld(true);
  for (const g of fadeGroups) {
    const own = new Map(); g.mats = [];
    for (const m of g.meshes) {
      if (!own.has(m.material)) { const c = m.material.clone(); own.set(m.material, c); g.mats.push(c); }

const fadeRay = new THREE.Ray(), fadeHit = new THREE.Vector3(), fadePts = [];
function updateFade(dt, s) {
  fadePts.length = 0;
  if (s && s.alive) { // a handful of points along the player's body
    const b = s.body, n = b.length, k = Math.max(1, Math.floor(n / 6));
    for (let i = 0; i < n; i += k) fadePts.push(b[i]);
    fadePts.push(b[n - 1]);
  }
  const cam = camera.position;
  for (const g of fadeGroups) {
    let hide = false;
    for (const p of fadePts) {
      const tx = p.x - cam.x, ty = s.r - cam.y, tz = p.z - cam.z, L = Math.hypot(tx, ty, tz);
      fadeRay.origin.copy(cam); fadeRay.direction.set(tx / L, ty / L, tz / L);
      for (const bx of g.boxes) if (fadeRay.intersectBox(bx, fadeHit) && fadeHit.distanceTo(cam) < L - s.r * 1.5) { hide = true; break; }
      if (hide) break;
    }
    const a = g.a + ((hide ? 0.3 : 1) - g.a) * Math.min(1, dt * 8);
    g.a = Math.abs(a - 1) < 0.01 ? 1 : a;
    for (const m of g.mats) { m.opacity = g.a; m.transparent = g.a < 1; }

  const idx = new Uint32Array((MAXP - 1) * RAD * 6); let o = 0;

function latheUV(g, np, polar, along) {

    if (prev !== null) { while (bu - prev > 0.5) bu -= 1; while (bu - prev < -0.5) bu += 1; }
    prev = bu;
    for (let j = 0; j < np; j++) { const v = i * np + j; uv.setXY(v, bu, along(P.getX(v), P.getY(v), P.getZ(v))); }
  }
  uv.needsUpdate = true;
}

      if (A === me) toast(`咬住「${B.name}」了！`);
      if (B === me) toast(me.skill === 'guard' ? `被「${A.name}」咬住了！快按縮緊或咬別人的尾巴把牠擠出去` : `被「${A.name}」咬住了！快咬別人的尾巴把牠擠出去`);
      continue;
    }
    if (ev.type === 'eject') { spawnSplash(ev.x, A ? A.r : 1, ev.z, 1, 0, '#ffffff'); if (A === me) toast(`被「${B.name}」擠出來了！`); if (B === me) toast(`把「${A.name}」擠出去了！`); continue; }
    if (ev.type === 'tissue') { if (A === me) toast('黏到衛生紙了…變慢！'); continue; }
    if (ev.type === 'bubble') { if (A === me) toast('鑽進泡泡了！5 秒內不會被同化'); continue; }
    if (ev.type === 'pop') { spawnSplash(ev.x, A ? A.r : 1, ev.z, 1, 0, '#ffe6ee'); if (A === me) toast('泡泡破了！'); continue; }
    if (ev.type === 'bounce') { if (A === me) toast(`「${B.name}」有泡泡保護，彈開了`); if (B === me) toast('泡泡把對方彈開了！'); continue; }
    if (ev.type === 'skill') { if (A === me) toast({ swap: '頭尾交換！', guard: '縮緊！3 秒不會被同化', ouro: '銜尾蛇！咬住自己 5 秒' }[ev.skill]); continue; }
    if (ev.type !== 'merged') continue;
    dropView(ev.b); spawnJelly(ev);
    if (A === me) toast(`同化了「${B.name}」！`);
    if (tut) { tutMerged(A, B); continue; }
    if (B === me) {
      running = false; camFollow = A;
      document.getElementById('overTitle').textContent = `你被「${A.name}」從尾巴同化了`;
      document.getElementById('overStats').textContent = `最長 ${me.bestLen.toFixed(1)} · 同化 ${me.absorbed} 條`;
      setTimeout(() => { document.getElementById('overOv').hidden = false; }, 900);
    }
    const g0 = gen;
    if (!B.isPlayer) setTimeout(() => { // keep the arena populated
      if (g0 !== gen) return;
      Sim.snakes = Sim.snakes.filter(s => s !== B);
      const taken = new Set(Sim.snakes.filter(s => s.alive).map(s => s.color));

}

    foodMesh.setMatrixAt(i, tmpM); foodMesh.setColorAt(i, colorObjs[p.c]);
  }
  foodMesh.count = fn; foodMesh.instanceMatrix.needsUpdate = true; if (foodMesh.instanceColor) foodMesh.instanceColor.needsUpdate = true;
  // waves

    w.m.scale.setScalar(1 + k * 9); w.m.material.opacity = 0.9 * (1 - k);

        const ring = new THREE.Mesh(new THREE.TorusGeometry(1, 0.14, 8, 28), new THREE.MeshStandardMaterial({ color: '#f3dfb8', transparent: true, opacity: 0.6, roughness: 0.3 }));
        g.add(tube, cap, tip, ring); scene.add(g); tv.bub = { g, tube, cap, tip, ring };

        acc += sl;
      }

}

// ---- shower: falling water streaks, clear wet patches on the floor, little ripples where drops land ----
function makeShower(root) {
  const S = MAP.shower, N = 450, topY = 10.5;
  const g = new THREE.BufferGeometry(), pos = new Float32Array(N * 6), st = [];
  const reset = (d, anyY) => { const a = Math.random() * 6.283, r = S.rain * Math.sqrt(Math.random()); d.x = S.cx + Math.cos(a) * r; d.z = S.cz + Math.sin(a) * r; d.y = anyY ? Math.random() * topY : topY + Math.random() * 1.5; d.v = 20 + Math.random() * 8; };
  for (let i = 0; i < N; i++) { const d = {}; reset(d, true); st.push(d); }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const rain = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: '#cfe9ff', transparent: true, opacity: 0.8, depthWrite: false }));
  rain.frustumCulled = false; root.add(rain);
  // clear wet patches: almost invisible water that only shows as a glossy sheen and reflections
  const wetMat = new THREE.MeshStandardMaterial({ color: '#5f7786', transparent: true, opacity: 0.2, roughness: 0.05, metalness: 0.2, envMap: metalEnv(), envMapIntensity: 0.35, depthWrite: false }); // wet tiles: a touch darker, glossy
  MAP.wet.forEach(([x, z, rx, rz], i) => {
    const m = new THREE.Mesh(puddleGeo, wetMat); m.position.set(x, 0.045, z); m.scale.set(rx, 1, rz); m.rotation.y = i * 0.7; m.renderOrder = -200000; root.add(m);
  });
  const ripG = new THREE.RingGeometry(0.75, 1, 24); ripG.rotateX(-Math.PI / 2);
  const rips = [];
  return function update(dt) {
    for (let i = 0; i < N; i++) {
      const d = st[i]; d.y -= d.v * dt;
      if (d.y <= 0.05) {
        if (rips.length < 40 && Math.random() < 0.25) { // ripple where it lands
          const m = new THREE.Mesh(ripG, new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.5, depthWrite: false }));
          m.position.set(d.x, 0.06, d.z); root.add(m); rips.push({ m, t: 0 });
        }
        reset(d, false);
      }
      const o = i * 6; pos[o] = pos[o + 3] = d.x; pos[o + 2] = pos[o + 5] = d.z; pos[o + 1] = d.y; pos[o + 4] = d.y + 0.75;
    }
    g.attributes.position.needsUpdate = true;
    for (let i = rips.length - 1; i >= 0; i--) {
      const r = rips[i]; r.t += dt; const k = r.t / 0.5;
      r.m.scale.setScalar(0.1 + k * 0.5); r.m.material.opacity = 0.5 * (1 - k);
      if (k >= 1) { scene.remove(r.m); r.m.material.dispose(); rips.splice(i, 1); }
    }
  };
}

// ---- opening title: SIZE MATTERZ, from Chiu's layered artwork. It pops in, the I and the snake squirt, then the TT holes clench twice ----
function showTitle(done) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, A = TITLE_ART;
  const ov = document.createElement('div'); ov.id = 'titleOv';
  ov.innerHTML = '<div class="tbox"></div><div class="skip">點一下跳過</div>';
  const box = ov.querySelector('.tbox'), P = {};
  const pc = (v, t) => (v / t * 100) + '%';
  for (const l of A.L) {
    const d = document.createElement('div'); d.className = 'tl';
    Object.assign(d.style, { left: pc(l.x, A.W), top: pc(l.y, A.H), width: pc(l.w, A.W), height: pc(l.h, A.H), opacity: 0 });
    const im = new Image(); im.src = l.src; im.alt = ''; im.draggable = false; d.appendChild(im);
    box.appendChild(d); P[l.id] = { el: d, l };
  }
  box.setAttribute('role', 'img'); box.setAttribute('aria-label', 'SIZE MATTERZ');
  // a lid over each hole: a ring of the letter's own rim colour that closes in when the hole clenches
  const lids = {};
  for (const [id, h] of Object.entries(A.holes)) {
    const p = P[id], l = p.l, lid = document.createElement('div'); lid.className = 'lid';
    Object.assign(lid.style, { left: pc(h.x - h.rx - l.x, l.w), top: pc(h.y - h.ry - l.y, l.h), width: pc(2 * h.rx, l.w), height: pc(2 * h.ry, l.h) });
    lid.style.setProperty('--c', h.col); lid.style.setProperty('--r', '100%');
    p.el.appendChild(lid); lids[id] = lid;
  }
  document.body.appendChild(ov);
  // every piece scales about a point given in canvas px
  const piece = (id, ox, oy) => {
    const { el, l } = P[id];
    el.style.transformOrigin = `${pc(ox - l.x, l.w)} ${pc(oy - l.y, l.h)}`;
    return { el, animate: (k, o) => el.animate(k, o) };
  };
  const bottom = id => { const l = P[id].l; return [l.x + l.w / 2, l.y + l.h]; };
  const centre = id => { const l = P[id].l; return [l.x + l.w / 2, l.y + l.h / 2]; };
  const back = piece('back', A.W / 2, A.H / 2);
  const L1 = ['S', 'I', 'Z1', 'E1'].map(n => piece(n, ...bottom(n)));
  const L2 = ['M', 'A', 'T1', 'T2', 'E2', 'R', 'Z2'].map(n => piece(n, ...bottom(n)));
  const snake = piece('snake', 1085, 330);
  const sp = piece('splashP', A.holes.I.x, A.holes.I.y), sb = piece('splashB', 1330, 300);
  const marks = ['mL1', 'mL2', 'mR1', 'mR2'].map(n => piece(n, ...centre(n)));
  let finished = false; const timers = [];
  const finish = () => {
    if (finished) return; finished = true; timers.forEach(clearTimeout);
    // a skip jumps every piece to its resting state, then the logo shrinks and rises to the top of the menu
    for (const a of ov.getAnimations()) if (a.effect.getTiming().iterations !== Infinity) a.finish();
    for (const id in P) P[id].el.style.opacity = 1;
    for (const id in lids) lids[id].style.setProperty('--r', '100%');
    ov.removeEventListener('click', finish); ov.classList.add('docked'); done && done();
  };
  ov.addEventListener('click', finish);
  const later = (ms, f) => timers.push(setTimeout(f, ms));
  const squash = (p, ms, delay, amt) => p.animate([{ transform: 'scale(1,1)', opacity: 1 }, { transform: `scale(${1 + amt * .6},${1 - amt})`, opacity: 1, offset: .35 }, { transform: `scale(${1 - amt * .2},${1 + amt * .25})`, opacity: 1, offset: .7 }, { transform: 'scale(1,1)', opacity: 1 }], { duration: ms, delay, easing: 'ease-out', composite: 'replace' });
  const D = reduce ? 0 : 1;
  // 0) the sticker plate swells in
  back.animate([{ transform: 'scale(.82)', opacity: 0 }, { transform: 'scale(1.03)', opacity: 1, offset: .6 }, { transform: 'none', opacity: 1 }], { duration: D ? 420 : 1, easing: 'cubic-bezier(.2,.9,.3,1.2)', fill: 'forwards' });
  // 1) the letters pop in one by one
  [...L1, ...L2].forEach((p, i) => p.animate([
    { transform: 'translateY(40px) scale(0) rotate(-12deg)', opacity: 0 },
    { transform: 'translateY(-16px) scale(1.2) rotate(4deg)', opacity: 1, offset: .55 },
    { transform: 'translateY(5px) scale(.94) rotate(-1deg)', opacity: 1, offset: .78 },
    { transform: 'none', opacity: 1 }], { duration: D ? 520 : 1, delay: D * (160 + i * 85), easing: 'cubic-bezier(.2,.9,.3,1.2)', fill: 'forwards' }));
  snake.animate([{ transform: 'scale(0,.4)', opacity: 0 }, { transform: 'scale(1.08,1.05)', opacity: 1, offset: .65 }, { transform: 'none', opacity: 1 }], { duration: D ? 560 : 1, delay: D * 560, easing: 'cubic-bezier(.2,.9,.3,1.2)', fill: 'forwards' });
  marks.forEach((p, i) => p.animate([{ opacity: 0, transform: 'scale(0)' }, { opacity: 1, transform: 'scale(1.25)', offset: .6 }, { opacity: 1, transform: 'none' }], { duration: 380, delay: D * (950 + i * 60), fill: 'forwards' }));
  // 2) the I and the snake's head squirt together
  later(D * 1250, () => {
    [sp, sb].forEach(p => p.animate([
      { transform: 'scale(0)', opacity: 0 }, { transform: 'scale(.55,1.15)', opacity: 1, offset: .3 },
      { transform: 'scale(1.12,.96)', opacity: 1, offset: .62 }, { transform: 'scale(.97,1.02)', opacity: 1, offset: .82 }, { transform: 'none', opacity: 1 }],
      { duration: D ? 620 : 1, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'forwards' }));
    [sp, sb].forEach((p, i) => p.animate([{ transform: 'none' }, { transform: 'scale(1.03,.98)' }, { transform: 'none' }], { duration: 700, delay: 640 + i * 120, iterations: Infinity, composite: 'add' }));
    squash(L1[1], 420, 0, .1); squash(snake, 420, 0, .07);
  });
  // 3) the two holes on TT clench twice: the lid ring closes to a pinhole and opens again
  const clench = (lid, ms) => {
    const t0 = performance.now(), K = [[0, 100], [.22, 22], [.45, 104], [.68, 22], [1, 100]];
    const step = now => {
      const t = Math.min(1, (now - t0) / ms); let i = 0; while (K[i + 1][0] < t) i++;
      const u = (t - K[i][0]) / (K[i + 1][0] - K[i][0]), e = u * u * (3 - 2 * u);
      lid.style.setProperty('--r', (K[i][1] + (K[i + 1][1] - K[i][1]) * e) + '%');
      if (t < 1 && !finished) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
  later(D * 2050, () => [['T1', L2[2]], ['T2', L2[3]]].forEach(([n, t]) => {
    clench(lids[n], 900);
    squash(t, 450, 0, .06); squash(t, 450, 450, .06);
  }));
  later(reduce ? 1800 : 3900, () => { if (!window.__titleHold) finish(); });
}
showTitle();
window.__sim = Sim; // handy for debugging in the console
})();
</script>
